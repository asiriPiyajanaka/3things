name: Bug report
description: Report reproducible incorrect behavior in 3Things
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include task prompts, credentials, or other private information.
  - type: input
    id: version
    attributes:
      label: 3Things version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, and Codex CLI version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
